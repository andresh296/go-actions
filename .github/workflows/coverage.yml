name: Go CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Check out el código
      - name: Check out code
        uses: actions/checkout@v2

      # Paso 2: Configurar Go
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.19'  # O la versión que estés utilizando

      # Paso 3: Instalar dependencias
      - name: Install dependencies
        run: go mod tidy

      # Paso 4: Ejecutar tests
      - name: Run tests
        run: go test -v ./...

      # Paso 5: Construir el proyecto
      - name: Build
        run: go build -v ./...

      # Paso 6: Subir el artefacto de la build (opcional)
      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: go-build-artifact
          path: ./your-executable  # Cambia esto al archivo que sea tu artefacto